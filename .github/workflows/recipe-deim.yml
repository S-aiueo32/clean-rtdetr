name: Recipe DEIM

on:
  push:
    branches: [main]
    paths:
      - "packages/core/src/**"
      - "packages/training/src/**"
      - "packages/core/pyproject.toml"
      - "packages/training/pyproject.toml"
      - "recipes/deim/**"
      - "!recipes/deim/**/*.md"
      - ".github/workflows/recipe-deim.yml"
  pull_request:
    paths:
      - "packages/core/src/**"
      - "packages/training/src/**"
      - "packages/core/pyproject.toml"
      - "packages/training/pyproject.toml"
      - "recipes/deim/**"
      - "!recipes/deim/**/*.md"
      - ".github/workflows/recipe-deim.yml"

  workflow_dispatch:

# Keep every main run; supersede older runs on other refs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  recipe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    defaults:
      run:
        working-directory: recipes/deim
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pytest tests
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ty check
