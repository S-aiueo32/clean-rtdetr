name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --package clean-rtdetr --extra inference
      - name: Check core dependency boundary
        run: >-
          uv run python -c
          "import importlib.util;
          forbidden = ('clean_rtdetr_export', 'clean_rtdetr_training', 'lightning', 'onnx', 'onnxruntime', 'onnxscript', 'scipy');
          present = [name for name in forbidden if importlib.util.find_spec(name) is not None];
          assert not present, f'unexpected core dependencies: {present}'"
      - name: Test core
        run: >-
          uv run pytest
          --cov=clean_rtdetr --cov-report=term-missing
          packages/core/tests/test_backbone.py
          packages/core/tests/test_checkpoint.py
          packages/core/tests/test_native_checkpoint.py
          packages/core/tests/test_decoder.py
          packages/core/tests/test_encoder.py
          packages/core/tests/test_inference_integration.py
          packages/core/tests/test_inference_parity.py
          packages/core/tests/test_core_jaxtyping_coverage.py
          packages/core/tests/test_model.py
          packages/core/tests/test_model_parity.py
          packages/core/tests/test_package_boundaries.py
          packages/core/tests/test_postprocessing.py
          packages/core/tests/test_predict_cli.py
          packages/core/tests/test_preprocessing.py
          packages/core/tests/test_properties.py
          packages/core/tests/test_stages.py

  training:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --package clean-rtdetr-training
      - name: Check training dependency boundary
        run: >-
          uv run python -c
          "import importlib.util;
          forbidden = ('clean_rtdetr_export', 'onnx', 'onnxruntime', 'onnxscript');
          present = [name for name in forbidden if importlib.util.find_spec(name) is not None];
          assert not present, f'unexpected training dependencies: {present}'"
      - name: Test training
        run: >-
          uv run pytest
          --cov=clean_rtdetr_training --cov-report=term-missing
          packages/training/tests
      - run: >-
          uv run
          clean-rtdetr-train --config-dir configs --config-name lightning_training
          trainer.max_epochs=1 output_dir=outputs/lightning
      - run: >-
          uv run
          clean-rtdetr-train --config-dir configs --config-name lightning_training
          trainer.max_epochs=2 output_dir=outputs/lightning
          resume=outputs/lightning/last.ckpt

  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --package clean-rtdetr-export
      - name: Check export dependency boundary
        run: >-
          uv run python -c
          "import importlib.util;
          forbidden = ('clean_rtdetr_training', 'lightning', 'scipy');
          present = [name for name in forbidden if importlib.util.find_spec(name) is not None];
          assert not present, f'unexpected export dependencies: {present}'"
      - name: Test export
        run: >-
          uv run pytest
          --cov=clean_rtdetr_export --cov-report=term-missing
          packages/export/tests/test_export.py
          packages/export/tests/test_export_cli.py
          packages/export/tests/test_export_jaxtyping_coverage.py

  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          python-version: "3.13"
          enable-cache: true
      - run: >-
          uv sync --locked --package clean-rtdetr
          --extra inference --extra evaluation
      - run: >-
          uv run pytest
          packages/core/tests/test_coco.py
          packages/core/tests/test_coco_cli.py

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          python-version: "3.13"
          enable-cache: true
      - run: >-
          uv sync --locked --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run python tools/query_selection.py
      - name: Build PyPI artifacts without workspace sources
        run: |
          uv build --package clean-rtdetr --no-sources --out-dir dist/core
          uv build --package clean-rtdetr-export --no-sources --out-dir dist/export
          uv build --package clean-rtdetr-training --no-sources --out-dir dist/training
      - name: Check installed core conversion command outside the checkout
        run: |
          uv export --locked --package clean-rtdetr --no-dev --no-emit-workspace --no-hashes --output-file /tmp/clean-rtdetr-core-requirements.txt
          uv venv /tmp/clean-rtdetr-core-smoke
          uv pip install --python /tmp/clean-rtdetr-core-smoke/bin/python -r /tmp/clean-rtdetr-core-requirements.txt dist/core/*.whl
          cd "$(mktemp -d)"
          /tmp/clean-rtdetr-core-smoke/bin/clean-rtdetr-convert --help
