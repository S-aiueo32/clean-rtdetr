name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  stages:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest --cov=clean_rtdetr --cov-report=term-missing
      - run: uv run python examples/lightning_training.py trainer.max_epochs=1 output_dir=outputs/lightning
      - run: uv run python examples/lightning_training.py trainer.max_epochs=2 output_dir=outputs/lightning resume=outputs/lightning/last.ckpt

  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --extra export
      - run: uv run pytest tests/test_export.py

  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --extra evaluation
      - run: uv run pytest tests/test_coco.py tests/test_coco_cli.py
