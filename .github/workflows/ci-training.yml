name: CI Training

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "packages/*/pyproject.toml"
      - "packages/core/src/**"
      - "packages/training/src/**"
      - "packages/training/tests/**"
      - "configs/**"
      - "tools/__init__.py"
      - "tools/compatibility/**"
      - "third_party/RT-DETR/**"
      - ".github/workflows/ci-training.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "packages/*/pyproject.toml"
      - "packages/core/src/**"
      - "packages/training/src/**"
      - "packages/training/tests/**"
      - "configs/**"
      - "tools/__init__.py"
      - "tools/compatibility/**"
      - "third_party/RT-DETR/**"
      - ".github/workflows/ci-training.yml"
  workflow_dispatch:

# Keep every main run; supersede older runs on other refs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  training:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --package clean-rtdetr-training
      - name: Check training dependency boundary
        run: >-
          uv run python -c
          "import importlib.util;
          forbidden = ('clean_rtdetr_export', 'onnx', 'onnxruntime', 'onnxscript');
          present = [name for name in forbidden if importlib.util.find_spec(name) is not None];
          assert not present, f'unexpected training dependencies: {present}'"
      - name: Test training
        run: >-
          uv run pytest
          --cov=clean_rtdetr_training --cov-report=term-missing
          packages/training/tests
      - run: >-
          uv run
          clean-rtdetr-train --config-dir configs --config-name lightning_training
          trainer.max_epochs=1 output_dir=outputs/lightning
      - run: >-
          uv run
          clean-rtdetr-train --config-dir configs --config-name lightning_training
          trainer.max_epochs=2 output_dir=outputs/lightning
          resume=outputs/lightning/last.ckpt
