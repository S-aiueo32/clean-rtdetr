defaults:
  - callbacks: default
  - _self_

_target_: lightning.pytorch.Trainer
accelerator: cpu
devices: 1
precision: 32-true
deterministic: true
max_epochs: 2
gradient_clip_val: 0.1
gradient_clip_algorithm: norm
accumulate_grad_batches: 1
logger: false
enable_progress_bar: false
enable_model_summary: false
