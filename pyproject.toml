[project]
name = "clean-rtdetr-workspace"
version = "0.0.0"
description = "Development workspace for the Clean RT-DETR packages"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "beartype>=0.20,<1",
    "pre-commit>=4,<5",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "ty>=0.0.1,<1",
]

[tool.uv]
package = false
# Evaluation stays optional; never fall back to a local native-extension build.
no-build-package = ["pycocotools"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["packages/core/tests", "packages/export/tests", "packages/training/tests"]
addopts = [
    "-ra",
    "--jaxtyping-packages=clean_rtdetr,clean_rtdetr_export,clean_rtdetr_training,beartype.beartype",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["ALL"]
# Keep the formatter and a single docstring layout authoritative.
ignore = ["COM812", "D203", "D213"]

[tool.ruff.lint.mccabe]
max-complexity = 7

[tool.ruff.lint.isort]
known-first-party = ["clean_rtdetr", "clean_rtdetr_export", "clean_rtdetr_training"]

[tool.ruff.lint.per-file-ignores]
# jaxtyping shape strings are not Python forward references (upstream FAQ).
"packages/*/src/**/*.py" = ["F722"]
# Pytest assertions and calls into the pinned upstream private stage methods.
"packages/*/tests/**" = ["INP001", "S101", "SLF001"]
# CLI commands and checkout-only diagnostics intentionally display results.
"packages/*/src/*/cli.py" = ["T201"]
"packages/*/src/*/cli/**" = ["T201"]
"tools/**" = ["T201"]
"tools/compatibility/**" = ["F722"]
"tools/checkpoint_parity.py" = ["E402", "T201"]

[tool.ty.src]
include = ["packages/*/src", "packages/*/tests", "tools"]

[tool.ty.environment]
extra-paths = ["packages/core/tests"]
